<!--
  Copy this whole _template/exhibit/ folder into the target wing, renamed to
  the new exhibit's slug:

    cp -r _template/exhibit wings/<wing-slug>/exhibits/<exhibit-slug>

  Then:
  1. Add the exhibit's entry to data/manifest.js (status: "coming-soon" is
     fine to start).
  2. Fill in exhibit.js (case / tension / further reading).
  3. Build the piece in art.js.
  4. Flip data-wing below to match the wing, and flip the manifest entry's
     status to "built" when ready.
  5. Fill in the title/description/og: placeholders below with the
     exhibit's real title and one-liner.

  The asset paths below assume this file lives 4 levels deep, at
  wings/<wing-slug>/exhibits/<exhibit-slug>/index.html — exactly where you're
  about to copy it. Don't open this copy of the file directly from
  _template/; the paths will 404 until it's moved.
-->

  <link rel="icon" type="image/svg+xml" href="../../../../shared/img/favicon.svg">

  <meta property="og:type" content="article">
